name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: windows-latest
            targets: aarch64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-latest
            targets: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            targets: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile || pnpm install

      - name: build frontend
        working-directory: apps/desktop
        run: pnpm build

      - name: linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          configPath: apps/desktop/src-tauri/tauri.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: "UCR ${{ github.ref_name }}"
          releaseBody: "Desktop builds — Windows .exe/.msi, Linux .AppImage/.deb, macOS .dmg. The Android APK builds separately (see docs/android.md)."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.targets }} --bundles ${{ matrix.bundles }}
