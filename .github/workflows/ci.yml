name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt + clippy + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # --workspace compiles ucr-desktop (tauri/webkit) + ucr-cli's serial
      # transport (libudev) — install both stacks.
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: unit + integration tests
        run: cargo test --workspace --exclude ucr-desktop --exclude ucr-core
      # Real-socket tests serialize — parallel UDP beacons contend for
      # loopback buffers and turn discovery timing into a flake lottery.
      - name: real-transport tests (serial)
        run: cargo test -p ucr-core --test real_udp -- --test-threads=1
      - name: mesh e2e suite
        run: cargo test -p ucr-core --test mesh

  sim-smoke:
    name: simulator smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: ucr-sim 3-node line scenario
        # --observe + prove discovery happened in output: RF loss makes
        # message delivery stochastic — a smoke test shouldn't fail on
        # collision luck. NeighborUpdate = the medium + nodes actually ran.
        run: |
          cargo run -p ucr-cli --bin ucr-sim -- run --nodes 3 --duration 90 --seed 7 --observe --json | tee sim-out.jsonl
          grep -q NeighborUpdate sim-out.jsonl
