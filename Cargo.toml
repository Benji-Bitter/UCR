[workspace]
resolver = "2"
members = [
    "crates/ucr-protocol",
    "crates/ucr-identity",
    "crates/ucr-crypto",
    "crates/ucr-transport",
    "crates/ucr-routing",
    "crates/ucr-storage",
    "crates/ucr-simulator",
    "crates/ucr-morse",
    "crates/ucr-core",
    "crates/ucr-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/Benji-Bitter/UCR"
authors = ["UCR Contributors"]

[workspace.dependencies]
# async / runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
postcard = "1.1"
serde_json = "1"

# cryptography
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }

# storage
redb = "2"

# utilities
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
heapless = "0.8"
smallvec = "1"
parking_lot = "0.12"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
